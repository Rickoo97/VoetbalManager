<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Online Voetbal Manager</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="app-layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo-icon">⚽</div>
      <div class="brand-text">Online VM <span class="badge">v3.10.0</span></div>
    </div>

    <nav id="main-nav" class="nav-links"></nav>

<div class="sidebar-footer">
      <a href="https://buymeacoffee.com/rickdekker" target="_blank" class="btn-coffee">
        ☕ Koop een koffie voor mij!
      </a>
      <div class="version-muted">By Rick</div>
    </div>
  </aside>

  <main class="main-content">
    
    <header class="top-header" id="topbar-stats">
      <div class="stats-group">
        <div class="stat-item">
          <span class="label">Club</span>
          <strong id="club-name">...</strong>
        </div>
        <div class="stat-item">
          <span class="label">Divisie</span>
          <strong id="club-division">...</strong>
        </div>
        <div class="stat-item">
          <span class="label">Budget</span>
          <strong id="budget" class="money">...</strong>
        </div>
        <div class="stat-item">
          <span class="label">Week</span>
          <strong id="matchday">1</strong>
        </div>
      </div>

      <div class="actions-group">
        <button id="btn-theme-toggle" class="btn-icon">🌙</button>
        <button class="primary action-btn" id="btn-continue">▶ Volgende Speelronde</button>
      </div>
    </header>

    <div id="view" class="view-container">
      </div>

  </main>
</div>

<div id="toast" class="toast"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
